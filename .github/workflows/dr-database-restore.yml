name: DR Database Restore

on:
  workflow_dispatch:
    inputs:
      approve_restore:
        description: 'Type "I APPROVE DR RESTORE" to confirm'
        required: true

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: dr-drill
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Approval
        run: |
          if [ "${{ github.event.inputs.approve_restore }}" != "I APPROVE DR RESTORE" ]; then
            echo "FATAL: Explicit operator approval required."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Execute Controlled Database Restore
        run: npx tsx scripts/dr-database-restore.ts
        env:
          PG_RESTORE_BIN: /usr/lib/postgresql/17/bin/pg_restore
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          DR_SUPABASE_DB_URL: ${{ secrets.DR_SUPABASE_DB_URL }}
          DR_SUPABASE_URL: ${{ secrets.DR_SUPABASE_URL }}
          DR_SUPABASE_SERVICE_ROLE: ${{ secrets.DR_SUPABASE_SERVICE_ROLE }}
