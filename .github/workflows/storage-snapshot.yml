name: Production Storage Snapshot

on:
  workflow_dispatch:
    inputs:
      ALLOW_EMPTY_SOURCE:
        description: 'Allow snapshot to complete if zero objects are found'
        type: boolean
        required: false
        default: false

concurrency:
  group: production-storage-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Create Immutable Snapshot
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Snapshot
        run: npx tsx scripts/storage-snapshot.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ALLOW_EMPTY_SOURCE: ${{ github.event.inputs.ALLOW_EMPTY_SOURCE }}
