name: Production Backup Restore Drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: restore-drill # Dedicated environment for isolated read-only R2 access

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Start Disposable Local Supabase Stack (Empty)
        run: |
          mv supabase/migrations supabase/migrations_disabled
          npx supabase start
          mv supabase/migrations_disabled supabase/migrations

      - name: Create Disposable Restore Database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "CREATE DATABASE tizkar_restore_drill;"

      - name: Execute Restore Drill
        run: npx tsx scripts/database-restore-drill.ts
        env:
          PG_RESTORE_BIN: /usr/lib/postgresql/17/bin/pg_restore
          # Strict scope: Pass ONLY read-only R2 credentials. NO PRODUCTION CREDENTIALS.
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          # Local disposable DB URL for the script to use
          LOCAL_DISPOSABLE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/tizkar_restore_drill
