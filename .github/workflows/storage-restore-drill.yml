name: Production Storage Restore Drill

on:
  workflow_dispatch: # Manual trigger only

jobs:
  drill:
    name: Legacy Mirror Restore Drill
    runs-on: ubuntu-latest
    environment: restore-drill
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Drill
        run: npx tsx scripts/storage-restore-drill.ts
        env:
          # Only read-only credentials allowed
          RESTORE_S3_ENDPOINT: ${{ secrets.RESTORE_S3_ENDPOINT }}
          RESTORE_S3_REGION: ${{ secrets.RESTORE_S3_REGION || 'auto' }}
          RESTORE_S3_ACCESS_KEY_ID: ${{ secrets.RESTORE_S3_ACCESS_KEY_ID }}
          RESTORE_S3_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_S3_SECRET_ACCESS_KEY }}
          RESTORE_S3_BUCKET: ${{ secrets.RESTORE_S3_BUCKET }}
