name: E2E Certification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Quality Gates
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Check Production Guard
        run: |
          if [[ "${NEXT_PUBLIC_SUPABASE_URL}" == *"hnjfxdyterpbmkisaiiw"* ]] || [[ "${NEXT_PUBLIC_APP_URL}" == *"tizkar.vercel.app"* ]]; then
            echo "ERROR: PRODUCTION TARGET DETECTED. ABORTING."
            exit 1
          fi

      - name: Setup Ephemeral Local Supabase (if secrets not provided)
        run: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ]; then
            echo "No external Supabase secrets configured. Starting ephemeral local Supabase stack..."
            
            # --- E2E Bootstrap Preparation ---
            echo "Preparing deterministic local migration sequence..."
            mv supabase/migrations supabase/migrations.bak
            cp -r supabase/migrations.bak supabase/migrations
            
            cat << 'EOF' > supabase/migrations/20260824000000_e2e_reference_seed.sql
            -- DEVELOPMENT ONLY: E2E Reference Data Bootstrap
            -- Injects required reference data to satisfy subsequent migrations without modifying history.
            
            INSERT INTO event_types (id, name_ar, name_en, slug, is_active, display_order)
            VALUES 
              ('a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d', 'زواج', 'Wedding', 'wedding', true, 1)
            ON CONFLICT (id) DO NOTHING;
            EOF
            # ---------------------------------
            
            npx supabase start
            STATUS_JSON=$(npx supabase status -o json)
            
            # Cleanup injected sequence so Git remains clean
            rm -rf supabase/migrations
            mv supabase/migrations.bak supabase/migrations
            
            API_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')
            ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY')
            SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY')
            
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> $GITHUB_ENV
            echo "E2E_ADMIN_EMAIL=admin@e2e.test" >> $GITHUB_ENV
            echo "E2E_ADMIN_PASSWORD=e2e-password-123456" >> $GITHUB_ENV
            echo "USING_LOCAL_SUPABASE=true" >> $GITHUB_ENV
          else
            echo "Using configured external Supabase test environment."
          fi

      - name: Seed Synthetic E2E Admin User
        run: node tests/e2e/helpers/seed-admin.mjs

      - name: Run Connectivity Preflight
        run: node tests/e2e/preflight.mjs

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e -- --project=chromium

      - name: Teardown Ephemeral Local Supabase
        if: always()
        run: |
          if [ "${USING_LOCAL_SUPABASE}" = "true" ]; then
            echo "Stopping ephemeral local Supabase stack..."
            npx supabase stop --no-backup
          fi

      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
